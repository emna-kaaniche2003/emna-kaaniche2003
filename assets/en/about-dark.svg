<text x="12" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#F0EBFF">Full-stack development and AI are what I love working on. I build applications end to end,</text>
<text x="12" y="57" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#F0EBFF">then make them smarter with RAG, LLMs and multi-agent orchestration.</text>
<text x="12" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#F0EBFF">Studying information systems first, then computer engineering, taught me to see every technical</text>
<text x="12" y="111" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#F0EBFF">problem in two ways: as something to architect, and as a decision to defend.</text>
