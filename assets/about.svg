<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="260" viewBox="0 0 920 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0.5" y="0.5" width="919" height="259" fill="#12161F" stroke="#2B3342" stroke-width="1"/>
<circle cx="32" cy="39" r="3.4" fill="#C9924F"/>
<text x="46" y="44" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#C9924F">À propos</text>
<text x="32" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#EDEAE2">Passionnée par le développement Full-Stack et l’Intelligence Artificielle, je construis des applications de bout en bout et je</text>
<text x="32" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#EDEAE2">les enrichis avec de l’IA — RAG, LLMs, orchestration multi-agents. Un double parcours en systèmes d’information puis en</text>
<text x="32" y="126" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#EDEAE2">ingénierie informatique m’a appris à traiter un problème technique à la fois comme une architecture à construire et comme</text>
<text x="32" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#EDEAE2">une décision à justifier.</text>
<text x="32" y="188" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9B9890">En ce moment : stage d’été sur un pipeline RAG multi-agents d’automatisation de tickets support. À suivre : un stage de fin</text>
<text x="32" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#9B9890">d’études (PFE), en recherche ou en industrie.</text>
</svg>