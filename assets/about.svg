<text x="12" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1B1530">Passionnée par le développement Full-Stack et l’Intelligence Artificielle, je construis des applications de bout en bout et</text>
<text x="12" y="57" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1B1530">je les enrichis avec de l’IA — RAG, LLMs, orchestration multi-agents. Un double parcours en systèmes d’information puis</text>
<text x="12" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1B1530">en ingénierie informatique m’a appris à traiter un problème technique à la fois comme une architecture à construire et</text>
<text x="12" y="111" font-family="Helvetica, Arial, sans-serif" font-size="15.5" fill="#1B1530">comme une décision à justifier.</text>
