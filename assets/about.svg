<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="276" viewBox="0 0 920 276" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs>
<rect width="920" height="276" fill="#FFFFFF"/>
<text x="4" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1F2933">Passionnée par le développement Full-Stack et l’Intelligence Artificielle, je construis des applications de bout en bout et je les</text>
<text x="4" y="51" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1F2933">enrichis avec de l’IA — RAG, LLMs, orchestration multi-agents. Un double parcours en systèmes d’information puis en ingénierie</text>
<text x="4" y="76" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1F2933">informatique m’a appris à traiter un problème technique à la fois comme une architecture à construire et comme une décision à</text>
<text x="4" y="101" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1F2933">justifier.</text>
<rect x="0.5" y="130.5" width="295.0" height="137" rx="10" fill="#FFFFFF" stroke="#D5E2E5"/>
<rect x="0.5" y="130.5" width="295.0" height="5" rx="2.5" fill="#14808F"/>
<text x="20" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#0B5563">Ce que je fais</text>
<text x="20" y="194" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">Applications web et mobiles de A à Z</text>
<text x="20" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">(Spring Boot, React, Angular, Flutter),</text>
<text x="20" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">enrichies d’IA : RAG, LLMs, Machine</text>
<text x="20" y="251" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">Learning.</text>
<rect x="312.5" y="130.5" width="295.0" height="137" rx="10" fill="#FFFFFF" stroke="#D5E2E5"/>
<rect x="312.5" y="130.5" width="295.0" height="5" rx="2.5" fill="#14808F"/>
<text x="332" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#0B5563">Situation actuelle</text>
<text x="332" y="194" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">Stage d’été sur un projet de support IA</text>
<text x="332" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">— pipeline RAG multi-agents</text>
<text x="332" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">d’automatisation de tickets.</text>
<rect x="624.5" y="130.5" width="295.0" height="137" rx="10" fill="#FFFFFF" stroke="#D5E2E5"/>
<rect x="624.5" y="130.5" width="295.0" height="5" rx="2.5" fill="#14808F"/>
<text x="644" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#0B5563">Ce que je cherche</text>
<text x="644" y="194" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">Un stage de fin d’études (PFE), en</text>
<text x="644" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">recherche ou en industrie : Full-Stack, IA,</text>
<text x="644" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5F6B76">ingénierie logicielle.</text>
